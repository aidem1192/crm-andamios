<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — ADN CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .input { @apply w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400 focus:border-transparent; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-100 to-gray-200 flex items-center justify-center p-4">

<div x-data="loginPage()" x-cloak class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-8">

  <!-- Logo / Título -->
  <div class="text-center mb-8">
    <div class="w-16 h-16 bg-orange-500 rounded-2xl mx-auto mb-4 flex items-center justify-center">
      <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
      </svg>
    </div>
    <h1 class="text-xl font-bold text-gray-800">Andamios y Derivados</h1>
    <p class="text-gray-400 text-sm mt-1">del Norte</p>
  </div>

  <form @submit.prevent="ingresar()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
      <input type="text" class="input" x-model="username" placeholder="tu usuario"
             autocomplete="username" autocapitalize="none">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
      <div class="relative">
        <input :type="verPass ? 'text' : 'password'" class="input pr-10" x-model="password"
               placeholder="••••••••" autocomplete="current-password">
        <button type="button" @click="verPass = !verPass"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
          <svg x-show="!verPass" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0zM2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          </svg>
          <svg x-show="verPass" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
          </svg>
        </button>
      </div>
    </div>

    <div x-show="error" x-cloak
         class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3"
         x-text="error"></div>

    <button type="submit" :disabled="cargando"
            class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2.5 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed">
      <span x-show="!cargando">Entrar</span>
      <span x-show="cargando">Verificando...</span>
    </button>
  </form>

  <p class="text-center text-xs text-gray-400 mt-6">
    ADN CRM &copy; 2025
  </p>
</div>

<script>
function loginPage() {
  return {
    username: '', password: '', error: '', cargando: false, verPass: false,

    async ingresar() {
      if (!this.username || !this.password) {
        this.error = 'Ingresa usuario y contraseña.';
        return;
      }
      this.cargando = true;
      this.error = '';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: this.username, password: this.password }),
        });
        const data = await res.json();
        if (!res.ok) {
          this.error = data.detail || 'Error al iniciar sesión.';
          return;
        }
        window.location.href = '/';
      } catch (e) {
        this.error = 'Error de conexión. Intenta de nuevo.';
      } finally {
        this.cargando = false;
      }
    },
  };
}
</script>
</body>
</html>
