{% extends "base.html" %}
{% block title %}Clientes{% endblock %}
{% block content %}
<div x-data="clientesPage()" x-init="init()" x-cloak>

  <div class="mb-5 flex items-center justify-between flex-wrap gap-2">
    <h1 class="text-xl font-bold text-gray-800">Clientes</h1>
    <div class="flex gap-2">
      <a href="/api/clientes/plantilla-excel"
         class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-semibold px-4 py-2 rounded-lg transition text-sm">
        ⬇ Descargar plantilla
      </a>
      <button @click="$refs.archivoExcel.click()"
              class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-semibold px-4 py-2 rounded-lg transition text-sm">
        ⬆ Importar Excel
      </button>
      <input type="file" x-ref="archivoExcel" accept=".xlsx,.xlsm" class="hidden" @change="importarExcel($event)">
      <button @click="abrirModal()" class="bg-orange-500 hover:bg-orange-600 text-white font-semibold px-4 py-2 rounded-lg transition text-sm">
        + Nuevo cliente
      </button>
    </div>
  </div>

  <!-- Resultado de importación -->
  <div x-show="importResult" x-cloak
       class="mb-4 p-3 rounded-lg text-sm"
       :class="importResult && importResult.errores && importResult.errores.length ? 'bg-yellow-50 text-yellow-800 border border-yellow-200' : 'bg-green-50 text-green-800 border border-green-200'">
    <div class="font-semibold" x-show="importResult">
      <span x-text="importResult ? importResult.importados : 0"></span> de
      <span x-text="importResult ? importResult.total_filas : 0"></span> clientes importados.
    </div>
    <ul class="mt-1 list-disc list-inside text-xs" x-show="importResult && importResult.errores && importResult.errores.length">
      <template x-for="e in (importResult ? importResult.errores : [])" :key="e">
        <li x-text="e"></li>
      </template>
    </ul>
    <button @click="importResult = null" class="text-xs underline mt-1">Cerrar</button>
  </div>

  <div class="card">
    <input type="text" class="input mb-4" placeholder="Buscar cliente..." x-model="q" @input.debounce.300ms="buscar()">
    <div x-show="clientes.length === 0" class="text-gray-400 text-center py-8">No hay clientes registrados.</div>
    <div class="space-y-2">
      <template x-for="c in clientes" :key="c.id">
        <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg hover:bg-orange-50 transition">
          <div>
            <div class="font-semibold text-sm" x-text="c.nombre"></div>
            <div class="text-xs text-gray-400" x-text="[c.telefono, c.domicilio].filter(Boolean).join(' · ')"></div>
          </div>
          <div class="flex gap-2">
            <button @click="editarCliente(c)" class="text-xs text-orange-500 hover:underline">Editar</button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- Modal nuevo/editar cliente -->
  <div x-show="modalAbierto" class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-lg p-6" @click.outside="modalAbierto = false">
      <h2 class="font-bold text-gray-800 mb-4" x-text="editandoId ? 'Editar cliente' : 'Nuevo cliente'"></h2>
      <form @submit.prevent="guardarCliente()" class="space-y-3">
        <div>
          <label class="label">Nombre completo *</label>
          <input type="text" class="input" x-model="form.nombre" required>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="label">Teléfono</label>
            <input type="text" class="input" x-model="form.telefono">
          </div>
          <div>
            <label class="label">RFC</label>
            <input type="text" class="input" x-model="form.rfc">
          </div>
        </div>
        <div>
          <label class="label">Domicilio</label>
          <input type="text" class="input" x-model="form.domicilio">
        </div>
        <div class="border-t pt-3">
          <div class="flex items-center justify-between mb-2">
            <label class="label mb-0">Referencias</label>
            <button type="button" @click="form.referencias.push({nombre:'',telefono:'',direccion:''})"
                    x-show="form.referencias.length < 2"
                    class="text-xs text-orange-500">+ Agregar</button>
          </div>
          <template x-for="(ref, i) in form.referencias" :key="i">
            <div class="grid grid-cols-3 gap-2 mb-2">
              <input type="text" class="input text-sm" x-model="ref.nombre" placeholder="Nombre">
              <input type="text" class="input text-sm" x-model="ref.telefono" placeholder="Teléfono">
              <div class="flex gap-1">
                <input type="text" class="input text-sm" x-model="ref.direccion" placeholder="Dirección">
                <button type="button" @click="form.referencias.splice(i,1)" class="text-red-400 px-1">✕</button>
              </div>
            </div>
          </template>
        </div>
        <div x-show="error" class="text-red-600 text-sm" x-text="error"></div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" @click="modalAbierto = false" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold px-4 py-2 rounded-lg">Cancelar</button>
          <button type="submit" class="bg-orange-500 hover:bg-orange-600 text-white font-semibold px-4 py-2 rounded-lg">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
function clientesPage() {
  return {
    clientes: [], q: '', modalAbierto: false, editandoId: null, error: '',
    importResult: null,
    form: { nombre: '', telefono: '', domicilio: '', rfc: '', referencias: [] },
    async init() { await this.buscar(); },
    async importarExcel(event) {
      const archivo = event.target.files[0];
      if (!archivo) return;
      this.importResult = null;
      const body = new FormData();
      body.append('archivo', archivo);
      try {
        const res = await fetch('/api/clientes/importar-excel', { method: 'POST', body });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Error al importar');
        this.importResult = data;
        await this.buscar();
      } catch(e) {
        this.importResult = { importados: 0, total_filas: 0, errores: [e.message] };
      } finally {
        event.target.value = '';
      }
    },
    async buscar() {
      this.clientes = await fetch('/api/clientes?q=' + encodeURIComponent(this.q)).then(r => r.json());
    },
    abrirModal() {
      this.editandoId = null; this.error = '';
      this.form = { nombre: '', telefono: '', domicilio: '', rfc: '', referencias: [] };
      this.modalAbierto = true;
    },
    async editarCliente(c) {
      this.editandoId = c.id; this.error = '';
      const data = await fetch('/api/clientes/' + c.id).then(r => r.json());
      this.form = { nombre: data.nombre, telefono: data.telefono||'', domicilio: data.domicilio||'', rfc: data.rfc||'',
        referencias: (data.referencias||[]).map(r => ({...r})) };
      this.modalAbierto = true;
    },
    async guardarCliente() {
      this.error = '';
      try {
        const url = this.editandoId ? '/api/clientes/' + this.editandoId : '/api/clientes';
        const method = this.editandoId ? 'PUT' : 'POST';
        const res = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(this.form) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Error');
        this.modalAbierto = false;
        await this.buscar();
      } catch(e) { this.error = e.message; }
    }
  }
}
</script>
{% endblock %}
