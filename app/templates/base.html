<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CRM Andamios{% endblock %} — Andamios y Derivados del Norte</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    .btn-primary { @apply bg-orange-500 hover:bg-orange-600 text-white font-semibold px-4 py-2 rounded-lg transition; }
    .btn-secondary { @apply bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold px-4 py-2 rounded-lg transition; }
    .btn-danger { @apply bg-red-500 hover:bg-red-600 text-white font-semibold px-4 py-2 rounded-lg transition; }
    .input { @apply border border-gray-300 rounded-lg px-3 py-2 w-full focus:outline-none focus:ring-2 focus:ring-orange-400; }
    .label { @apply block text-sm font-medium text-gray-700 mb-1; }
    .card { @apply bg-white rounded-xl shadow-sm border border-gray-200 p-5; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- Navbar -->
<nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 flex items-center justify-between h-14">
    <a href="/" class="flex items-center gap-2 font-bold text-orange-600 text-lg">
      {% if logo_url %}
        <img src="{{ logo_url }}" alt="Logo" class="h-8 w-auto object-contain">
      {% else %}
        🏗️
      {% endif %}
      <span class="hidden sm:inline">Andamios y Derivados del Norte</span>
      <span class="sm:hidden">ADN</span>
    </a>
    <div class="flex items-center gap-1 text-sm">
      <a href="/" class="px-3 py-1.5 rounded-lg hover:bg-orange-50 text-gray-600 hover:text-orange-600 font-medium">Inicio</a>
      <a href="/contratos/nuevo" class="px-3 py-1.5 rounded-lg hover:bg-orange-50 text-gray-600 hover:text-orange-600 font-medium">+ Contrato</a>
      <a href="/clientes" class="px-3 py-1.5 rounded-lg hover:bg-orange-50 text-gray-600 hover:text-orange-600 font-medium">Clientes</a>
      <a href="/materiales" class="px-3 py-1.5 rounded-lg hover:bg-orange-50 text-gray-600 hover:text-orange-600 font-medium">Materiales</a>
      <a href="/reportes" class="px-3 py-1.5 rounded-lg hover:bg-orange-50 text-gray-600 hover:text-orange-600 font-medium">Reportes</a>
      <a href="/agenda" class="px-3 py-1.5 rounded-lg hover:bg-orange-50 text-gray-600 hover:text-orange-600 font-medium">📅 Agenda</a>
      <a href="/rh/empleados" class="px-3 py-1.5 rounded-lg hover:bg-orange-50 text-gray-600 hover:text-orange-600 font-medium">RH</a>
      <a href="/configuracion" class="px-3 py-1.5 rounded-lg hover:bg-orange-50 text-gray-600 hover:text-orange-600 font-medium">⚙ Config</a>
      <!-- Usuario / cerrar sesión -->
      <div x-data="{ open: false }" class="relative ml-2">
        <button @click="open = !open"
                class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          <span id="nav-username">{{ session_user.nombre if session_user else 'Usuario' }}</span>
        </button>
        <div x-show="open" @click.outside="open = false" x-cloak
             class="absolute right-0 mt-1 w-44 bg-white rounded-xl shadow-lg border border-gray-100 py-1 z-50">
          <div class="px-3 py-2 text-xs text-gray-400 border-b border-gray-100">
            {{ session_user.username if session_user else '' }}
            <span class="ml-1 text-orange-500 font-medium">{{ session_user.rol if session_user else '' }}</span>
          </div>
          <button onclick="cerrarSesion()"
                  class="w-full text-left px-3 py-2 text-sm text-red-600 hover:bg-red-50 flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            Cerrar sesión
          </button>
        </div>
      </div>
    </div>
  </div>
</nav>

<main class="max-w-7xl mx-auto px-4 sm:px-6 py-6">
  {% block content %}{% endblock %}
</main>

<script>
async function cerrarSesion() {
  await fetch('/api/auth/logout', { method: 'POST' });
  window.location.href = '/login';
}
</script>
</body>
</html>
