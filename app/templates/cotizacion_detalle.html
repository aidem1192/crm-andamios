{% extends "base.html" %}
{% block title %}Cotización{% endblock %}
{% block content %}
<div x-data="cotizacionDetalle({{ cotizacion_id }})" x-init="cargar()">

  <!-- Header -->
  <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
    <div class="flex items-center gap-3">
      <a href="/cotizaciones" class="text-gray-400 hover:text-orange-600">← Cotizaciones</a>
      <h1 class="text-2xl font-bold text-gray-800" x-text="c ? c.folio : 'Cargando…'"></h1>
      <span x-show="c" :class="badgeClass(c && c.estado)" x-text="estadoLabel(c && c.estado)"></span>
    </div>
    <div class="flex gap-2 flex-wrap" x-show="c">
      <a :href="'/api/cotizaciones/' + id + '/pdf'" target="_blank"
         class="btn-primary flex items-center gap-1">
        📄 Descargar PDF
      </a>
      <!-- Cambiar estado -->
      <template x-if="c && c.estado === 'borrador'">
        <button @click="cambiarEstado('enviada')"
                class="bg-blue-500 hover:bg-blue-600 text-white font-semibold px-4 py-2 rounded-lg transition">
          Marcar Enviada
        </button>
      </template>
      <template x-if="c && c.estado === 'enviada'">
        <button @click="cambiarEstado('aceptada')"
                class="bg-green-500 hover:bg-green-600 text-white font-semibold px-4 py-2 rounded-lg transition">
          ✓ Aceptada
        </button>
      </template>
      <template x-if="c && (c.estado === 'enviada' || c.estado === 'borrador')">
        <button @click="cambiarEstado('rechazada')"
                class="bg-red-500 hover:bg-red-600 text-white font-semibold px-4 py-2 rounded-lg transition">
          ✕ Rechazada
        </button>
      </template>
      <template x-if="c && c.estado !== 'borrador'">
        <button @click="cambiarEstado('borrador')"
                class="btn-secondary text-sm">
          Volver a Borrador
        </button>
      </template>
      <button @click="confirmarEliminar()"
              class="btn-danger text-sm">🗑</button>
    </div>
  </div>

  <!-- Cargando -->
  <template x-if="cargando">
    <div class="text-center py-16 text-gray-400">Cargando cotización…</div>
  </template>

  <template x-if="!cargando && c">
    <div class="space-y-6">

      <!-- Info cliente y condiciones -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="card">
          <h2 class="font-semibold text-gray-600 text-sm uppercase tracking-wide mb-3">Cliente</h2>
          <p class="text-lg font-bold text-gray-800" x-text="c.cliente_nombre"></p>
          <p x-show="c.cliente_telefono" class="text-gray-600 text-sm mt-1" x-text="'📞 ' + c.cliente_telefono"></p>
          <p x-show="c.cliente_domicilio" class="text-gray-600 text-sm" x-text="'📍 ' + c.cliente_domicilio"></p>
          <p x-show="c.cliente_rfc" class="text-gray-500 text-sm" x-text="'RFC: ' + c.cliente_rfc"></p>
          <p x-show="c.lugar_obra" class="text-gray-500 text-sm mt-1" x-text="'🏗️ Obra: ' + c.lugar_obra"></p>
        </div>
        <div class="card">
          <h2 class="font-semibold text-gray-600 text-sm uppercase tracking-wide mb-3">Condiciones</h2>
          <div class="space-y-1 text-sm text-gray-700">
            <div class="flex justify-between">
              <span class="text-gray-500">Fecha</span>
              <span x-text="c.fecha"></span>
            </div>
            <div class="flex justify-between">
              <span class="text-gray-500">Vigencia</span>
              <span x-text="c.vigencia_dias + ' días'"></span>
            </div>
            <div class="flex justify-between">
              <span class="text-gray-500">IVA incluido</span>
              <span x-text="c.incluye_iva ? 'Sí (16%)' : 'No'"></span>
            </div>
            <div x-show="c.descuento_pct > 0" class="flex justify-between">
              <span class="text-gray-500">Descuento</span>
              <span x-text="c.descuento_pct + '%'"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Conceptos -->
      <div class="card">
        <h2 class="font-semibold text-gray-700 text-lg border-b pb-2 mb-4">Conceptos</h2>
        <div class="overflow-x-auto">
          <table class="min-w-full text-sm">
            <thead>
              <tr class="text-left text-gray-500 border-b">
                <th class="pb-2 pr-4">Tipo</th>
                <th class="pb-2 pr-4">Descripción</th>
                <th class="pb-2 pr-4 text-center">Cantidad</th>
                <th class="pb-2 pr-4 text-right">P. Unitario</th>
                <th class="pb-2 text-right">Total</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="l in c.lineas" :key="l.id">
                <tr class="border-b border-gray-100">
                  <td class="py-2 pr-4">
                    <span :class="l.tipo === 'material' ? 'bg-blue-100 text-blue-700' : 'bg-teal-100 text-teal-700'"
                          class="px-2 py-0.5 rounded-full text-xs font-medium"
                          x-text="l.tipo === 'material' ? 'Material' : 'Servicio'"></span>
                  </td>
                  <td class="py-2 pr-4 font-medium" x-text="l.descripcion"></td>
                  <td class="py-2 pr-4 text-center" x-text="l.cantidad"></td>
                  <td class="py-2 pr-4 text-right" x-text="'$' + Number(l.precio_unitario).toLocaleString('es-MX', {minimumFractionDigits:2})"></td>
                  <td class="py-2 text-right font-semibold" x-text="'$' + Number(l.total_linea).toLocaleString('es-MX', {minimumFractionDigits:2})"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <!-- Totales -->
        <div class="flex justify-end mt-4">
          <div class="space-y-1 text-sm min-w-56">
            <div class="flex justify-between text-gray-600">
              <span>Subtotal</span>
              <span x-text="'$' + Number(c.subtotal).toLocaleString('es-MX', {minimumFractionDigits:2})"></span>
            </div>
            <div x-show="c.descuento_pct > 0" class="flex justify-between text-gray-600">
              <span x-text="'Descuento (' + c.descuento_pct + '%)'"></span>
              <span x-text="'- $' + Number(c.descuento_monto).toLocaleString('es-MX', {minimumFractionDigits:2})"></span>
            </div>
            <div x-show="c.incluye_iva" class="flex justify-between text-gray-600">
              <span>IVA (16%)</span>
              <span x-text="'$' + Number(c.iva).toLocaleString('es-MX', {minimumFractionDigits:2})"></span>
            </div>
            <div class="flex justify-between font-bold text-lg text-orange-700 border-t pt-2">
              <span>TOTAL</span>
              <span x-text="'$' + Number(c.total).toLocaleString('es-MX', {minimumFractionDigits:2})"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Notas -->
      <div class="card" x-show="c.notas">
        <h2 class="font-semibold text-gray-700 mb-2">Notas</h2>
        <p class="text-sm text-gray-600 whitespace-pre-line" x-text="c.notas"></p>
      </div>

    </div>
  </template>

  <!-- Modal eliminar -->
  <div x-show="modalEliminar" x-cloak
       class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-xl p-6 max-w-sm w-full mx-4">
      <h3 class="font-bold text-gray-800 mb-2">¿Eliminar cotización?</h3>
      <p class="text-gray-600 text-sm mb-4">Esta acción no se puede deshacer.</p>
      <div class="flex gap-3 justify-end">
        <button @click="modalEliminar = false" class="btn-secondary">Cancelar</button>
        <button @click="eliminar()" class="btn-danger">Eliminar</button>
      </div>
    </div>
  </div>
</div>

<script>
function cotizacionDetalle(id) {
  return {
    id, c: null, cargando: true, modalEliminar: false,

    async cargar() {
      this.cargando = true;
      const r = await fetch('/api/cotizaciones/' + this.id);
      if (r.ok) this.c = await r.json();
      this.cargando = false;
    },

    async cambiarEstado(nuevo) {
      const r = await fetch('/api/cotizaciones/' + this.id + '/estado?estado=' + nuevo, { method: 'PATCH' });
      if (r.ok) { this.c.estado = nuevo; }
    },

    badgeClass(estado) {
      const m = {
        borrador:  'bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full text-sm font-medium',
        enviada:   'bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full text-sm font-medium',
        aceptada:  'bg-green-100 text-green-700 px-2 py-0.5 rounded-full text-sm font-medium',
        rechazada: 'bg-red-100 text-red-700 px-2 py-0.5 rounded-full text-sm font-medium',
      };
      return (estado && m[estado]) || m.borrador;
    },

    estadoLabel(e) {
      return { borrador:'Borrador', enviada:'Enviada', aceptada:'Aceptada', rechazada:'Rechazada' }[e] || (e || '');
    },

    confirmarEliminar() { this.modalEliminar = true; },

    async eliminar() {
      const r = await fetch('/api/cotizaciones/' + this.id, { method: 'DELETE' });
      if (r.ok) window.location.href = '/cotizaciones';
    },
  };
}
</script>
{% endblock %}
