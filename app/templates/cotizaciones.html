{% extends "base.html" %}
{% block title %}Cotizaciones{% endblock %}
{% block content %}
<div x-data="cotizacionesApp()" x-init="cargar()">
  <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Cotizaciones</h1>
    <a href="/cotizaciones/nueva" class="btn-primary">+ Nueva Cotización</a>
  </div>

  <!-- Filtros -->
  <div class="card mb-5 flex flex-wrap gap-3 items-center">
    <input x-model="filtro" @input="filtrar()" placeholder="Buscar folio o cliente…"
           class="input max-w-xs" />
    <select x-model="filtroEstado" @change="filtrar()" class="input max-w-xs">
      <option value="">Todos los estados</option>
      <option value="borrador">Borrador</option>
      <option value="enviada">Enviada</option>
      <option value="aceptada">Aceptada</option>
      <option value="rechazada">Rechazada</option>
    </select>
  </div>

  <!-- Tabla -->
  <div class="card overflow-x-auto">
    <table class="min-w-full text-sm">
      <thead>
        <tr class="text-left text-gray-500 border-b border-gray-200">
          <th class="pb-3 pr-4">Folio</th>
          <th class="pb-3 pr-4">Cliente</th>
          <th class="pb-3 pr-4">Fecha</th>
          <th class="pb-3 pr-4">Vigencia</th>
          <th class="pb-3 pr-4 text-right">Total</th>
          <th class="pb-3 pr-4">Estado</th>
          <th class="pb-3"></th>
        </tr>
      </thead>
      <tbody>
        <template x-if="cargando">
          <tr><td colspan="7" class="py-8 text-center text-gray-400">Cargando…</td></tr>
        </template>
        <template x-if="!cargando && lista.length === 0">
          <tr><td colspan="7" class="py-8 text-center text-gray-400">No hay cotizaciones.</td></tr>
        </template>
        <template x-for="c in lista" :key="c.id">
          <tr class="border-b border-gray-100 hover:bg-orange-50 transition">
            <td class="py-3 pr-4 font-mono font-semibold text-orange-700" x-text="c.folio"></td>
            <td class="py-3 pr-4 font-medium" x-text="c.cliente_nombre"></td>
            <td class="py-3 pr-4 text-gray-600" x-text="c.fecha"></td>
            <td class="py-3 pr-4 text-gray-500" x-text="c.vigencia_dias + ' días'"></td>
            <td class="py-3 pr-4 text-right font-semibold" x-text="'$' + Number(c.total).toLocaleString('es-MX', {minimumFractionDigits:2})"></td>
            <td class="py-3 pr-4">
              <span :class="badgeClass(c.estado)" x-text="estadoLabel(c.estado)"></span>
            </td>
            <td class="py-3">
              <a :href="'/cotizaciones/' + c.id"
                 class="text-orange-600 hover:underline font-medium">Ver</a>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>

<script>
function cotizacionesApp() {
  return {
    todas: [], lista: [], cargando: true,
    filtro: '', filtroEstado: '',

    async cargar() {
      this.cargando = true;
      const r = await fetch('/api/cotizaciones');
      this.todas = await r.json();
      this.filtrar();
      this.cargando = false;
    },

    filtrar() {
      let d = this.todas;
      if (this.filtro.trim()) {
        const q = this.filtro.toLowerCase();
        d = d.filter(c => c.folio.toLowerCase().includes(q) || c.cliente_nombre.toLowerCase().includes(q));
      }
      if (this.filtroEstado) d = d.filter(c => c.estado === this.filtroEstado);
      this.lista = d;
    },

    badgeClass(estado) {
      const m = {
        borrador:  'bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full text-xs font-medium',
        enviada:   'bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full text-xs font-medium',
        aceptada:  'bg-green-100 text-green-700 px-2 py-0.5 rounded-full text-xs font-medium',
        rechazada: 'bg-red-100 text-red-700 px-2 py-0.5 rounded-full text-xs font-medium',
      };
      return m[estado] || m.borrador;
    },

    estadoLabel(e) {
      return { borrador:'Borrador', enviada:'Enviada', aceptada:'Aceptada', rechazada:'Rechazada' }[e] || e;
    },
  };
}
</script>
{% endblock %}
